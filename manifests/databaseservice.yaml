apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      component: postgres
  template:
    metadata:
      labels:
        component: postgres
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
    spec:
      # Postgres and libpq accept a private key owned by root only when its
      # group may read it and nobody else; the group is postgres's.
      securityContext:
        fsGroup: 999
      containers:
        - name: databaseservice
          image: databaseservice
          ports:
            - name: postgres
              containerPort: 5432
          livenessProbe:
            initialDelaySeconds: 180
            tcpSocket:
              port: 5432
          volumeMounts:
            - name: server-tls
              mountPath: /etc/postgresql/tls/server
              readOnly: true
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
          ports:
            - name: metrics
              containerPort: 9187
          env:
            - name: DATA_SOURCE_URI
              value: "localhost:5432/postgres?sslmode=verify-full&sslrootcert=/etc/postgresql/tls/client/ca.crt&sslcert=/etc/postgresql/tls/client/tls.crt&sslkey=/etc/postgresql/tls/client/tls.key"
            - name: DATA_SOURCE_USER
              value: postgres
          volumeMounts:
            - name: client-tls
              mountPath: /etc/postgresql/tls/client
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: server-tls
          secret:
            secretName: postgres-server-tls
            defaultMode: 0640
        - name: client-tls
          secret:
            secretName: postgres-client-tls
            defaultMode: 0640
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  type: ClusterIP
  selector:
    component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
    - name: metrics
      port: 9187
      targetPort: 9187
