name: Build & test project

on:
  push:
    # Everything the build, lint or kind test reads; docs and editor files are out.
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!LICENSE"
      - "!flake.nix"
      - "!flake.lock"
      - "!.envrc"
      - "!.editorconfig"
      - "!.gitattributes"
      - "!.github/**"
      - ".github/workflows/ci.yml"
  schedule:
    - cron: "0 6 * * *"

jobs:
  build:
    name: Build & check format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install clippy on stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo build
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Set nightly for cargo fmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt -- --check

  integration-test:
    name: Integration test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Install latest version of Kind
        run: go install sigs.k8s.io/kind@v0.33.0
      - run: PATH=$(go env GOPATH)/bin:$PATH kind version
      - name: Create Kind cluster
        run: PATH=$(go env GOPATH)/bin:$PATH kind create cluster --config kind-config.yaml
      - name: Install skaffold
        run: |
          curl -Lo skaffold https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64
          chmod +x skaffold
          sudo mv skaffold /usr/local/bin
      - run: skaffold version
      - run: make bootstrap
      - run: make e2e
